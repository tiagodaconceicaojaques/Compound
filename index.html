<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMPOUND<meta property="og:title" content="COMPOUND — track your own pre-season"> <meta property="og:description" content="Brain, Corporate, Fitness, Mental Health. Honest scoring, focus on the weakest link, progress that compounds."> <meta property="og:image" content="https://tiagodaconceicaojaques.github.io/Compound/og-image.png"> <meta property="og:url" content="https://tiagodaconceicaojaques.github.io/Compound/"> <meta property="og:type" content="website"> <meta name="twitter:card" content="summary_large_image">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg:#12161c; --bg-raised:#181d25; --line:#2a313c;
    --petrol:#1f3b4d; --petrol-light:#2c5468;
    --copper:#c98a3b; --copper-dim:#8a6531;
    --sage:#6b8f71; --rust:#b6542f;
    --ink:#ece9e2; --ink-dim:#9aa2ad; --ink-faint:#5c6572;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; padding-bottom:70px; }
  ::selection{background:var(--copper); color:#12161c;}
  a, button, input, textarea, summary{font-family:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--copper); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

  header{ padding:26px 20px 16px; border-bottom:1px solid var(--line); position:relative; overflow:hidden; }
  header::before{ content:""; position:absolute; inset:0; background:repeating-linear-gradient(115deg, rgba(201,138,59,0.035) 0px, rgba(201,138,59,0.035) 1px, transparent 1px, transparent 26px); pointer-events:none; }
  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--copper); margin:0 0 8px; }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:clamp(22px,6vw,28px); line-height:1.1; margin:0; letter-spacing:-0.01em; }
  .stamp{ position:absolute; top:24px; right:20px; border:1.5px solid var(--copper-dim); color:var(--copper); font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; padding:5px 9px; transform:rotate(4deg); border-radius:3px; text-transform:uppercase; white-space:nowrap; }

  nav#tabNav{
    display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch;
    padding:12px 16px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--bg); z-index:10;
    scrollbar-width:none;
  }
  nav#tabNav::-webkit-scrollbar{ display:none; }
  .tab-btn{
    flex:0 0 auto; display:flex; align-items:center; gap:6px;
    background:var(--bg-raised); border:1px solid var(--line); border-radius:20px;
    padding:8px 14px; color:var(--ink-dim); font-size:13px; white-space:nowrap;
  }
  .tab-btn .tico{ font-size:14px; }
  .tab-btn.active{ background:rgba(201,138,59,0.12); border-color:var(--copper); color:var(--copper); }

  #xpBar{
    position:sticky; top:53px; z-index:9;
    background:var(--bg-raised); border-bottom:1px solid var(--line);
    padding:9px 16px 10px;
  }
  .xp-row{ display:flex; align-items:center; gap:10px; font-family:'IBM Plex Mono',monospace; font-size:11px; margin-bottom:6px; }
  .xp-level{ color:var(--copper); font-weight:500; }
  .xp-streak{ color:var(--ink-dim); }
  .xp-total{ margin-left:auto; color:var(--ink-faint); }
  .xp-track{ height:4px; background:var(--line); border-radius:4px; overflow:hidden; }
  .xp-fill{ height:100%; background:linear-gradient(90deg, var(--copper-dim), var(--copper)); border-radius:4px; transition:width .3s ease; }

  main{ max-width:640px; margin:0 auto; padding:16px; }
  .view{ display:none; }
  .view.active{ display:block; }

  .dashboard-card{ background:var(--bg-raised); border:1px solid var(--line); border-radius:10px; padding:22px 18px; }
  .overall-row{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  .overall-label{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); }
  .overall-score{ font-family:'Fraunces',serif; font-weight:600; font-size:30px; color:var(--ink); }
  .overall-score span{ font-size:15px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; }
  #radar{ display:block; margin:6px auto 4px; }
  .focus-box{ margin-top:16px; padding-top:16px; border-top:1px solid var(--line); }
  .focus-label{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--rust); margin:0 0 10px; }
  .focus-item{ display:flex; align-items:center; justify-content:space-between; font-size:13.5px; padding:9px 0; border-bottom:1px solid rgba(42,49,60,0.6); background:none; border-left:none; border-right:none; border-top:none; width:100%; text-align:left; color:var(--ink); }
  .focus-item:last-child{ border-bottom:none; }
  .focus-item:hover{ color:var(--copper); }
  .focus-item .farea{ color:var(--ink-faint); font-size:11.5px; margin-left:6px; }
  .focus-item .fscore{ font-family:'IBM Plex Mono',monospace; color:var(--rust); font-size:13px; }
  .area-summary-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
  .area-summary-tile{ background:#0f1319; border:1px solid var(--line); border-radius:8px; padding:12px; text-align:left; color:var(--ink); }
  .area-summary-tile .t-icon{ font-size:16px; }
  .area-summary-tile .t-label{ font-size:12px; color:var(--ink-dim); display:block; margin:4px 0 2px; }
  .area-summary-tile .t-score{ font-family:'IBM Plex Mono',monospace; font-size:16px; color:var(--copper); }

  .area-philosophy{ font-size:13px; color:var(--ink-dim); font-style:italic; line-height:1.5; margin:0 0 16px; padding-bottom:14px; border-bottom:1px solid var(--line); }
  .view-title{ display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .view-title .vicon{ font-size:22px; }
  .view-title h2{ font-family:'Fraunces',serif; font-weight:600; font-size:20px; margin:0; }
  .view-badge{ margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--sage); border:1px solid rgba(107,143,113,0.4); padding:3px 9px; border-radius:20px; }

  .panel{ background:var(--bg-raised); border:1px solid var(--line); border-radius:10px; padding:18px; margin-top:14px; }

  .dim-row{ padding:12px 0; border-bottom:1px solid rgba(42,49,60,0.6); }
  .dim-row:last-of-type{ border-bottom:none; }
  .dim-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .dim-name{ font-size:13.5px; color:var(--ink); }
  .dim-val{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--copper); min-width:26px; text-align:right; }
  .dim-stat{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-faint); margin-top:6px; }
  input[type=range]{ width:100%; height:4px; border-radius:4px; background:var(--line); appearance:none; -webkit-appearance:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:var(--copper); border:2px solid #0f1319; cursor:pointer; margin-top:-6px; }
  input[type=range]::-moz-range-thumb{ width:16px; height:16px; border-radius:50%; background:var(--copper); border:2px solid #0f1319; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track{ height:4px; border-radius:4px; background:var(--line); }

  .save-row{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .btn{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:.04em; background:transparent; border:1px solid var(--petrol-light); color:var(--ink); padding:8px 13px; border-radius:6px; }
  .btn:hover{ border-color:var(--copper); color:var(--copper); }
  .btn.primary{ background:var(--copper); border-color:var(--copper); color:#12161c; font-weight:500; }
  .btn.primary:hover{ background:#dda054; color:#12161c; }
  .btn.small{ padding:6px 10px; font-size:10.5px; }
  .status-msg{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--sage); margin-top:8px; min-height:14px; }

  .section-label{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--copper); margin:18px 0 10px; }

  .history{ margin-top:6px; }
  .history-row{ display:flex; align-items:center; gap:10px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-dim); padding:4px 0; }
  .bar-track{ flex:1; height:6px; background:var(--line); border-radius:4px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--sage); border-radius:4px; }
  .history-pct{ width:34px; text-align:right; color:var(--ink); }

  .tool-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; }
  .tool-btn{ display:flex; flex-direction:column; align-items:flex-start; gap:4px; background:#0f1319; border:1px solid var(--line); border-radius:8px; padding:12px 13px; color:var(--ink); font-size:13px; text-align:left; }
  .tool-btn:hover{ border-color:var(--copper); }
  .tool-btn .glyph{ font-family:'IBM Plex Mono',monospace; color:var(--copper); font-size:13px; }
  .tool-btn .tname{ font-weight:500; }
  .tool-btn .meta{ color:var(--ink-faint); font-size:10.5px; font-family:'IBM Plex Mono',monospace; }
  .tool-btn.wide{ grid-column:1 / -1; flex-direction:row; align-items:center; }
  .tool-btn.wide .meta{ margin-left:auto; }

  .curriculum{ margin-top:8px; }
  .curr-row{ display:flex; gap:10px; padding:10px 0; border-bottom:1px solid rgba(42,49,60,0.6); font-size:12.5px; align-items:baseline; }
  .curr-row:last-child{ border-bottom:none; }
  .curr-q{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); min-width:26px; }
  .curr-row.active .curr-q{ color:var(--copper); }
  .curr-topic{ color:var(--ink-dim); line-height:1.4; }
  .curr-row.active .curr-topic{ color:var(--ink); }
  .curr-note{ font-size:11.5px; color:var(--ink-faint); margin-top:10px; line-height:1.5; }

  .task{ display:flex; align-items:flex-start; gap:11px; padding:9px 0; border-bottom:1px solid rgba(42,49,60,0.6); font-size:14px; line-height:1.4; }
  .task:last-of-type{ border-bottom:none; }

  textarea{ width:100%; background:#0f1319; border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:10px 12px; font-size:13.5px; font-family:'Inter',sans-serif; resize:vertical; min-height:64px; line-height:1.5; }
  textarea:focus{ border-color:var(--copper); }
  input[type=text]{ width:100%; background:#0f1319; border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:10px 12px; font-size:13.5px; font-family:'Inter',sans-serif; }
  input[type=text]:focus{ border-color:var(--copper); }

  .entry{ font-size:12.5px; color:var(--ink-dim); padding:9px 0; border-bottom:1px solid rgba(42,49,60,0.6); line-height:1.5; }
  .entry:last-child{ border-bottom:none; }
  .entry-date{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-faint); display:block; margin-bottom:3px; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(10,13,17,0.9); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; overflow-y:auto; }
  .modal-overlay.open{ display:flex; }
  .modal-box{ background:var(--bg-raised); border:1px solid var(--line); border-radius:12px; width:100%; max-width:420px; padding:24px 20px 22px; text-align:center; position:relative; margin:auto; }
  .modal-box.wide{ text-align:left; }
  .modal-close{ position:absolute; top:12px; right:14px; background:none; border:none; color:var(--ink-faint); font-size:20px; line-height:1; padding:4px; }
  .modal-close:hover{ color:var(--copper); }
  .modal-title{ font-family:'Fraunces',serif; font-weight:600; font-size:19px; margin:0 0 6px; }
  .modal-sub{ color:var(--ink-dim); font-size:12.5px; margin:0 0 18px; line-height:1.4; }
  .prompt-box{ background:#0f1319; border:1px solid var(--petrol-light); border-radius:8px; padding:14px; font-size:13.5px; line-height:1.5; margin-bottom:14px; text-align:left; color:var(--ink); }
  .prompt-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--copper); margin-bottom:8px; display:block; }
  .field-label{ font-size:12px; color:var(--ink-dim); margin:12px 0 6px; text-align:left; }

  .choice-group{ display:flex; flex-direction:column; gap:8px; text-align:left; }
  .choice-btn{ background:#0f1319; border:1px solid var(--line); border-radius:8px; padding:11px 13px; color:var(--ink-dim); font-size:13px; text-align:left; line-height:1.4; }
  .choice-btn:hover{ border-color:var(--copper-dim); }
  .choice-btn.selected{ border-color:var(--copper); background:rgba(201,138,59,0.1); color:var(--ink); }
  .choice-btn.correct{ border-color:var(--sage); background:rgba(107,143,113,0.14); color:var(--ink); }
  .choice-btn.wrong{ border-color:var(--rust); background:rgba(182,84,47,0.12); color:var(--ink); }
  .quiz-explain{ font-size:12.5px; color:var(--ink-dim); line-height:1.5; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); text-align:left; display:none; }
  .quiz-explain.show{ display:block; }
  .quiz-score{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--copper); margin-top:14px; }

  .grade-box{ display:none; margin-top:16px; padding-top:16px; border-top:1px solid var(--line); text-align:center; }
  .grade-box.show{ display:block; }
  .grade-score{ font-family:'Fraunces',serif; font-weight:700; font-size:38px; }
  .grade-score span{ font-size:16px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; font-weight:400; }
  .grade-score.high{ color:var(--sage); }
  .grade-score.mid{ color:var(--copper); }
  .grade-score.low{ color:var(--rust); }
  .grade-feedback{ font-size:13px; color:var(--ink-dim); line-height:1.5; margin-top:8px; text-align:left; }
  .grade-loading{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-faint); margin-top:14px; }

  .breath-circle{ width:140px; height:140px; margin:10px auto 18px; border-radius:50%; background:radial-gradient(circle at 35% 30%, var(--petrol-light), var(--petrol)); border:1.5px solid var(--copper-dim); display:flex; align-items:center; justify-content:center; transform:scale(0.7); transition:transform 3.8s ease-in-out; }
  .breath-circle span{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink); }
  .breath-count{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); margin-bottom:16px; }

  .game-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:6px 0 18px; }
  .game-tile{ aspect-ratio:1; border-radius:10px; border:1.5px solid var(--line); opacity:0.55; transition:opacity .15s ease, transform .1s ease; }
  .game-tile.lit{ opacity:1; transform:scale(0.96); }
  .game-tile[data-c="0"]{ background:var(--petrol-light); }
  .game-tile[data-c="1"]{ background:var(--copper-dim); }
  .game-tile[data-c="2"]{ background:var(--sage); }
  .game-tile[data-c="3"]{ background:#7a5a8c; }
  .game-status{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-dim); margin-bottom:14px; min-height:16px; }
  .game-scores{ display:flex; justify-content:center; gap:22px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); margin-top:2px; }
  .game-scores b{ color:var(--copper); font-weight:500; }

  .focus-timer{ font-family:'Fraunces',serif; font-weight:600; font-size:44px; margin:14px 0; }
  .duration-row{ display:flex; gap:8px; justify-content:center; margin-bottom:8px; }
  .duration-row .btn.selected{ border-color:var(--copper); color:var(--copper); }
  .distract-count{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-dim); margin:10px 0; }

  footer{ max-width:640px; margin:34px auto 0; padding:18px 16px 0; border-top:1px solid var(--line); color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; font-size:11px; text-align:center; line-height:1.6; }
  .loading{ text-align:center; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; font-size:12px; padding:30px; }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Personal development system</p>
  <h1>COMPOUND</h1>
  <div class="stamp" id="quarterStamp">Q— · 20—</div>
</header>

<nav id="tabNav"></nav>
<div id="xpBar"></div>

<main id="app">
  <div class="loading">Loading…</div>
</main>

<footer>
  Honest scoring, not aspirational. Data stays on this device only.
</footer>

<div class="modal-overlay" id="breathModal">
  <div class="modal-box">
    <button class="modal-close" data-close="breathModal">×</button>
    <p class="modal-title">Box breathing</p>
    <p class="modal-sub">4s in · 4s hold · 4s out · 4s hold. 5 cycles.</p>
    <div class="breath-circle" id="breathCircle"><span id="breathLabel">Ready</span></div>
    <p class="breath-count" id="breathCount">Cycle 0 / 5</p>
    <button class="btn primary" id="breathStart">Start</button>
  </div>
</div>

<div class="modal-overlay" id="gameModal">
  <div class="modal-box">
    <button class="modal-close" data-close="gameModal">×</button>
    <p class="modal-title">Sequence</p>
    <p class="modal-sub">Working memory, not general intelligence. Memorize and repeat.</p>
    <div class="game-grid" id="gameGrid">
      <div class="game-tile" data-c="0" data-i="0"></div>
      <div class="game-tile" data-c="1" data-i="1"></div>
      <div class="game-tile" data-c="2" data-i="2"></div>
      <div class="game-tile" data-c="3" data-i="3"></div>
    </div>
    <p class="game-status" id="gameStatus">Tap Start</p>
    <button class="btn primary" id="gameStart">Start</button>
    <div class="game-scores"><span>Level: <b id="gameLevel">0</b></span><span>Best: <b id="gameBest">0</b></span></div>
  </div>
</div>

<div class="modal-overlay" id="strategicModal">
  <div class="modal-box wide">
    <button class="modal-close" data-close="strategicModal">×</button>
    <p class="modal-title">Strategic thinking</p>
    <p class="modal-sub">Build the tree before you look for the right answer.</p>
    <div class="prompt-box"><span class="prompt-label">Dilemma</span><span id="strategicPrompt">—</span></div>
    <p class="field-label">Possible explanations / options (at least 3)</p>
    <textarea id="strategicA" placeholder="1. ...&#10;2. ...&#10;3. ..."></textarea>
    <p class="field-label">Which one you'd pick and why</p>
    <textarea id="strategicB" placeholder="Your pick and the logic behind it…"></textarea>
    <div class="save-row">
      <button class="btn small" id="strategicNew">New dilemma</button>
      <button class="btn small" id="strategicReveal">See suggested approach</button>
      <button class="btn primary small" id="strategicSave">Grade and save</button>
    </div>
    <p class="grade-loading" id="strategicLoading" style="display:none;">Grading…</p>
    <p class="status-msg" id="strategicStatus"></p>
    <div class="grade-box" id="strategicGradeBox">
      <div class="grade-score" id="strategicScore">–<span>/10</span></div>
      <p class="grade-feedback" id="strategicFeedback"></p>
    </div>
    <div class="prompt-box" id="strategicModelBox" style="display:none; border-color:var(--sage);"><span class="prompt-label" style="color:var(--sage);">Suggested approach, not the only right one</span><span id="strategicModel"></span></div>
  </div>
</div>

<div class="modal-overlay" id="caseModal">
  <div class="modal-box wide">
    <button class="modal-close" data-close="caseModal">×</button>
    <p class="modal-title">Case of the month</p>
    <p class="modal-sub">90 seconds to convince the CEO. Write it like you mean it.</p>
    <div class="prompt-box"><span class="prompt-label">Case</span><span id="casePrompt">—</span></div>
    <p class="field-label">Structured response (context, options, recommendation, next step)</p>
    <textarea id="caseA" style="min-height:110px;" placeholder="Write it as if you were actually presenting…"></textarea>
    <div class="save-row">
      <button class="btn small" id="caseNew">New case</button>
      <button class="btn small" id="caseReveal">See suggested approach</button>
      <button class="btn primary small" id="caseSave">Grade and save</button>
    </div>
    <p class="grade-loading" id="caseLoading" style="display:none;">Grading…</p>
    <p class="status-msg" id="caseStatus"></p>
    <div class="grade-box" id="caseGradeBox">
      <div class="grade-score" id="caseScore">–<span>/10</span></div>
      <p class="grade-feedback" id="caseFeedback"></p>
    </div>
    <div class="prompt-box" id="caseModelBox" style="display:none; border-color:var(--sage);"><span class="prompt-label" style="color:var(--sage);">Suggested approach, not the only right one</span><span id="caseModel"></span></div>
  </div>
</div>

<div class="modal-overlay" id="reasoningQuizModal">
  <div class="modal-box wide">
    <button class="modal-close" data-close="reasoningQuizModal">×</button>
    <p class="modal-title">Reasoning</p>

  const REASONING_QUIZ = [
    { q:'A fair coin is flipped 3 times and lands heads all 3 times. What is the probability of heads on the 4th flip?', opts:['Less than 50%, heads has come up too many times already','Exactly 50%, each flip is independent','Greater than 50%, the streak tends to continue','Impossible to predict'], correct:1, explain:"Independent flips have no memory. The gambler's fallacy assumes the past influences the next flip, it doesn't." },
    { q:'A product launches and sales rise 20%. That same month the overall economy grew 15%. Did the product cause the rise?', opts:['Yes, it coincides in time','Not necessarily, it could be the broader economy, the variable needs isolating','Yes, the company is better than its competitors',"We can't say anything about sales"], correct:1, explain:"Timing correlation doesn't prove causation. You need to isolate the economic variable before crediting the product." },
    { q:'1% of the population has a rare disease. A test has 95% sensitivity and 90% specificity. Does a positive result mean the person almost certainly has the disease?', opts:['Yes, 95% certain','No, most positives are false positives due to the low base rate','Yes, because specificity is high',"There's no way to know"], correct:1, explain:'With a low base rate, even a good test produces more false positives than true positives in absolute terms. Ignoring the base rate is a classic mistake.' },

    { q:'"I smoked for 20 years and I am fine, so smoking is not that dangerous." What reasoning error is this?', opts:["None, it's valid","Survivorship bias, you don't see who didn't survive",'Sunk cost fallacy','Anchoring'], correct:1, explain:"You only hear from the survivors telling the story. Whoever didn't make it isn't here to contradict it." },

  function monthKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
  function quarterLabel(d){ const q = Math.floor(d.getMonth()/3)+1; return `Q${q} · ${d.getFullYear()}`; }

  async function safeGet(key){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
  async function safeSet(key, value){ try{ localStorage.setItem(key, JSON.stringify(value)); return true; } catch(e){ console.error('storage set failed', e); return null; } }
  async function safeList(prefix){
    try{
      const keys = [];
      for(let i=0; i<localStorage.length; i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(prefix)) keys.push(k);
      }
      return keys;
    } catch(e){ return []; }
  }
  function avg(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }
  function pick(bank){ return bank[Math.floor(Math.random()*bank.length)]; }
  async function loadAreaScores(areaId, month){ return (await safeGet(`score:${areaId}:${month}`)) || {}; }

  async function gradeWithClaude(systemInstruction, userContent){
    try{
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 400,
          messages: [
            { role: "user", content: `${systemInstruction}\n\n${userContent}\n\nRespond ONLY with valid JSON, no markdown, no text before or after: {"score": <integer 0-10>, "feedback": "<direct feedback in English, max 3 sentences>"}` }
          ]
        })
      });
      const data = await response.json();
      const textBlock = (data.content || []).find(b => b.type === 'text');
      if(!textBlock) return null;
      const clean = textBlock.text.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);
      if(typeof parsed.score !== 'number') return null;
      return { score: Math.max(0, Math.min(10, Math.round(parsed.score))), feedback: parsed.feedback || '' };
    }catch(e){
      console.error('grading failed', e);
      return null;
    }
  }

  function paintGradeBox(scoreEl, boxEl, feedbackEl, result){

      feedbackEl.textContent = 'Automatic grading is unavailable in this file. It only works when you open the app through the Claude link, not the downloaded file. Use "See suggested approach" to compare on your own.';
      scoreEl.textContent = '–';

      boxEl.classList.add('show');
      return;

    scoreEl.innerHTML = `${result.score}<span>/10</span>`;
    scoreEl.className = 'grade-score ' + (result.score >= 8 ? 'high' : result.score >= 5 ? 'mid' : 'low');
    feedbackEl.textContent = result.feedback;
    boxEl.classList.add('show');
  }

  // ---------- XP / LEVEL / STREAK ----------
  function levelInfo(xp){
    const level = Math.floor(xp/100) + 1;
    let title = 'Recruit';
    if(level >= 21) title = 'Top 1%';
    else if(level >= 11) title = 'Elite';
    else if(level >= 6) title = 'Specialist';
    else if(level >= 3) title = 'Operator';
    return { level, title, xpIntoLevel: xp % 100 };
  }
  async function bumpStreak(){
    const today = now.toISOString().slice(0,10);
    const s = (await safeGet('streak:data')) || {count:0, lastDate:null};
    if(s.lastDate === today) return s;
    const yesterday = new Date(now); yesterday.setDate(yesterday.getDate()-1);
    const yStr = yesterday.toISOString().slice(0,10);
    s.count = (s.lastDate === yStr) ? s.count + 1 : 1;
    s.lastDate = today;
    await safeSet('streak:data', s);
    return s;
  }
  async function renderXPBar(){
    const bar = document.getElementById('xpBar');
    if(!bar) return;
    const xpData = (await safeGet('xp:total')) || {value:0};
    const streakData = (await safeGet('streak:data')) || {count:0};
    const info = levelInfo(xpData.value);
    bar.innerHTML = `
      <div class="xp-row">
        <span class="xp-level">Level ${info.level} · ${info.title}</span>
        <span class="xp-streak">🔥 ${streakData.count || 0}d</span>
        <span class="xp-total">${xpData.value} XP</span>
      </div>
      <div class="xp-track"><div class="xp-fill" style="width:${info.xpIntoLevel}%"></div></div>
    `;
  }
  async function addXP(amount){
    if(!amount || amount <= 0) return;
    const cur = (await safeGet('xp:total')) || {value:0};
    cur.value += amount;
    await safeSet('xp:total', cur);
    await bumpStreak();
    renderXPBar();
  }

  function drawRadar(canvas, areaAverages){
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const cx = w/2, cy = h/2, R = Math.min(w,h)/2 - 34;
    const n = areaAverages.length;
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle = 'rgba(154,162,173,0.18)'; ctx.lineWidth = 1;
    for(let ring=1; ring<=4; ring++){
      const r = R*(ring/4);
      ctx.beginPath();
      for(let i=0;i<=n;i++){
        const ang = -Math.PI/2 + i*(2*Math.PI/n);
        const x = cx + r*Math.cos(ang), y = cy + r*Math.sin(ang);
        i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    ctx.fillStyle = '#9aa2ad'; ctx.font = '11px IBM Plex Mono, monospace';
    areaAverages.forEach((a,i)=>{
      const ang = -Math.PI/2 + i*(2*Math.PI/n);
      const x2 = cx + R*Math.cos(ang), y2 = cy + R*Math.sin(ang);
      ctx.strokeStyle = 'rgba(154,162,173,0.18)';
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x2,y2); ctx.stroke();
      const lx = cx + (R+18)*Math.cos(ang), ly = cy + (R+18)*Math.sin(ang);
      ctx.textAlign = Math.abs(Math.cos(ang))<0.2 ? 'center' : (Math.cos(ang)>0?'left':'right');
      ctx.fillText(`${a.icon} ${a.value.toFixed(1)}`, lx, ly+4);
    });
    ctx.beginPath();
    areaAverages.forEach((a,i)=>{
      const ang = -Math.PI/2 + i*(2*Math.PI/n);
      const r = R*(a.value/10);
      const x = cx + r*Math.cos(ang), y = cy + r*Math.sin(ang);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });
    ctx.closePath();
    ctx.fillStyle = 'rgba(201,138,59,0.22)'; ctx.strokeStyle = '#c98a3b'; ctx.lineWidth = 1.5;
    ctx.fill(); ctx.stroke();
  }

  async function dimStatText(areaId, idx){
    if(areaId === 'intelecto'){
      if(idx === 0){ const s = await safeGet('quizscore:reasoning'); return s ? `data: ${s.correct}/${s.total} correct` : 'data: no attempts yet'; }
      if(idx === 1){
        const log = await safeGet(`strategic:intelecto:${currentMonth}`);
        if(!log || !log.length) return 'data: no dilemmas this month';
        const scored = log.filter(e=>e.score != null);
        return `data: ${log.length} dilemmas this month${scored.length ? `, avg ${avg(scored.map(e=>e.score)).toFixed(1)}/10` : ''}`;
      }
      if(idx === 2){
        const log = await safeGet(`learning:intelecto:${currentMonth}`);
        if(!log || !log.length) return 'data: no topics this month';
        const scored = log.filter(e=>e.score != null);
        return `data: ${log.length} topics this month${scored.length ? `, avg ${avg(scored.map(e=>e.score)).toFixed(1)}/10` : ''}`;
      }
      if(idx === 3){ const s = await safeGet('game:intelecto:bestscore'); return `data: best level ${s ? s.best : 0}`; }
      if(idx === 4){ const s = await safeGet('quizscore:critical'); return s ? `data: ${s.correct}/${s.total} correct` : 'data: no attempts yet'; }
      if(idx === 5){ const log = await safeGet(`focus:intelecto:${currentMonth}`); return `data: ${log ? log.length : 0} sessions this month`; }
    }
    if(areaId === 'emocional'){
      const events = (await safeGet(`emorecords:emocional:${currentMonth}`)) || [];
      if(idx === 0 && events.length){ return `data: avg reaction gap ${avg(events.map(e=>e.gap)).toFixed(1)}/3 this month`; }
      if(idx === 3 && events.length){ return `data: avg recovery ${avg(events.map(e=>e.recovery)).toFixed(1)}/3 this month`; }
    }
    return null;
  }

      }
      label.textContent = 'Done'; countEl.textContent = `Cycle ${cycles} / ${cycles}`;

  (function(){
    const tiles = Array.from(document.querySelectorAll('#gameGrid .game-tile'));
    const statusEl = document.getElementById('gameStatus');
    const startBtn = document.getElementById('gameStart');
    const levelEl = document.getElementById('gameLevel');
    const bestEl = document.getElementById('gameBest');
    let sequence = [], userStep = 0, accepting = false;
    async function loadBest(){ const data = await safeGet('game:intelecto:bestscore'); bestEl.textContent = data ? data.best : 0; return data ? data.best : 0; }
    loadBest();
    function lightTile(i, ms=450){ return new Promise(res=>{ tiles[i].classList.add('lit'); setTimeout(()=>{ tiles[i].classList.remove('lit'); setTimeout(res, 180); }, ms); }); }
    async function playSequence(){ accepting = false; statusEl.textContent = 'Watch…'; for(const i of sequence){ await lightTile(i); } statusEl.textContent = 'Your turn'; accepting = true; userStep = 0; }
    function nextRound(){ sequence.push(Math.floor(Math.random()*4)); levelEl.textContent = sequence.length - 1; playSequence(); }
    tiles.forEach(t=>{
      t.addEventListener('click', async ()=>{
        if(!accepting) return;
        const i = Number(t.getAttribute('data-i'));
        t.classList.add('lit'); setTimeout(()=>t.classList.remove('lit'), 200);
        if(i === sequence[userStep]){
          userStep++;
          if(userStep === sequence.length){
            accepting = false; statusEl.textContent = 'Correct. Next round…';
            await addXP(3);
            setTimeout(nextRound, 700);
          }
        } else {
          accepting = false;
          const finalLevel = sequence.length - 1;
          statusEl.textContent = `You missed it at level ${finalLevel}.`;
          const best = await loadBest();
          if(finalLevel > best){ await safeSet('game:intelecto:bestscore', {best:finalLevel}); bestEl.textContent = finalLevel; statusEl.textContent = `New best: level ${finalLevel}.`; await addXP(15); }
          startBtn.textContent = 'Play again';
        }
      });
    });
    startBtn.addEventListener('click', ()=>{ sequence = []; userStep = 0; levelEl.textContent = 0; startBtn.textContent = 'Playing…'; nextRound(); });
  })();

  function setupQuiz(cfg){
    const questionEl = document.getElementById(cfg.qId);

    const nextBtn = document.getElementById(cfg.nextId);

    async function refreshScore(){
      const s = await safeGet(cfg.storageKey);
      scoreEl.textContent = s ? `Score: ${s.correct}/${s.total} correct (${Math.round((s.correct/s.total)*100)}%)` : 'Score: 0/0, not started yet';
    }

    function loadQuestion(){
      current = pick(cfg.bank);
      answered = false;
      questionEl.textContent = current.q;
      explainEl.classList.remove('show');
      explainEl.textContent = '';
      optionsEl.innerHTML = '';
      current.opts.forEach((opt, i)=>{
        const b = document.createElement('button');
        b.className = 'choice-btn';
        b.textContent = opt;
        b.addEventListener('click', async ()=>{
          if(answered) return;
          answered = true;
          const buttons = optionsEl.querySelectorAll('.choice-btn');
          buttons.forEach((bb, ii)=>{
            if(ii === current.correct) bb.classList.add('correct');
            else if(ii === i) bb.classList.add('wrong');
          });
          explainEl.textContent = current.explain;
          explainEl.classList.add('show');
          const s = (await safeGet(cfg.storageKey)) || {correct:0, total:0};
          s.total += 1;
          const isCorrect = i === current.correct;
          if(isCorrect) s.correct += 1;
          await safeSet(cfg.storageKey, s);
          await addXP(isCorrect ? 7 : 2);
          refreshScore();
        });
        optionsEl.appendChild(b);
      });
    }
    nextBtn.addEventListener('click', loadQuestion);
    loadQuestion();
    refreshScore();
  }
  setupQuiz({ qId:'rqQuestion', optId:'rqOptions', explainId:'rqExplain', nextId:'rqNext', scoreId:'rqScore', bank:REASONING_QUIZ, storageKey:'quizscore:reasoning' });
  setupQuiz({ qId:'cqQuestion', optId:'cqOptions', explainId:'cqExplain', nextId:'cqNext', scoreId:'cqScore', bank:CRITICAL_QUIZ, storageKey:'quizscore:critical' });

  // LEARNING
  (function(){
    const topicEl = document.getElementById('learnTopic');
    const textEl = document.getElementById('learnText');
    const saveBtn = document.getElementById('learnSave');
    const statusEl = document.getElementById('learnStatus');
    const loadingEl = document.getElementById('learnLoading');
    const gradeBox = document.getElementById('learnGradeBox');
    const scoreEl = document.getElementById('learnScore');
    const feedbackEl = document.getElementById('learnFeedback');
    const historyEl = document.getElementById('learnHistory');
    async function renderHistory(){
      const log = (await safeGet(`learning:intelecto:${currentMonth}`)) || [];
      historyEl.innerHTML = '';
      log.slice(-5).reverse().forEach(e=>{
        const div = document.createElement('div');
        div.className = 'entry';
        div.innerHTML = `<span class="entry-date">${e.date} · ${e.topic}${e.score != null ? ' · ' + e.score + '/10' : ''}</span>${e.text}`;
        historyEl.appendChild(div);
      });
    }
    renderHistory();
    saveBtn.addEventListener('click', async ()=>{
      if(!topicEl.value.trim() || !textEl.value.trim()) return;
      saveBtn.disabled = true; loadingEl.style.display = 'block'; gradeBox.classList.remove('show');
      const result = await gradeWithClaude(
        "You are grading using the Feynman technique. Assess whether the explanation avoids unnecessary jargon, is accurate, and would be understandable to someone with no prior knowledge of the topic. Be direct about what's missing.",
        `Topic: ${topicEl.value.trim()}\n\nUser's explanation: ${textEl.value.trim()}`
      );
      loadingEl.style.display = 'none'; saveBtn.disabled = false;
      paintGradeBox(scoreEl, gradeBox, feedbackEl, result);
      const key = `learning:intelecto:${currentMonth}`;
      const log = (await safeGet(key)) || [];
      log.push({ date: now.toLocaleDateString('en-GB'), topic: topicEl.value.trim(), text: textEl.value.trim(), score: result ? result.score : null });
      await safeSet(key, log);
      await addXP(result ? result.score*2 : 5);
      topicEl.value = ''; textEl.value = '';
      statusEl.textContent = 'Saved.'; setTimeout(()=>{ statusEl.textContent=''; }, 2200);
      renderHistory();
    });
  })();

  // FOCUS
  (function(){
    const timerEl = document.getElementById('focusTimer');
    const durBtns = document.querySelectorAll('.duration-row .btn');
    const startBtn = document.getElementById('focusStart');
    const stopBtn = document.getElementById('focusStop');
    const distractBtn = document.getElementById('distractBtn');
    const distractCountEl = document.getElementById('distractCount');
    const statusEl = document.getElementById('focusStatus');
    let plannedMin = 25, remaining = 25*60, interval = null, distractions = 0, running = false;

    function render(){ const m = Math.floor(remaining/60), s = remaining%60; timerEl.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
    render();
    durBtns.forEach(b=>{
      b.addEventListener('click', ()=>{
        if(running) return;
        durBtns.forEach(x=>x.classList.remove('selected'));
        b.classList.add('selected');
        plannedMin = Number(b.getAttribute('data-dur'));
        remaining = plannedMin*60; render();
      });
    });
    distractBtn.addEventListener('click', ()=>{ if(!running) return; distractions++; distractCountEl.textContent = distractions; });

    async function finishSession(actualSeconds){
      const key = `focus:intelecto:${currentMonth}`;
      const log = (await safeGet(key)) || [];
      log.push({ date: now.toLocaleDateString('en-GB'), plannedMin, actualMin: Math.round(actualSeconds/60), distractions });
      await safeSet(key, log);
      await addXP(10 + Math.max(0, 5 - distractions));
      statusEl.textContent = 'Session saved.';
      setTimeout(()=>{ statusEl.textContent=''; }, 2600);
    }

    startBtn.addEventListener('click', ()=>{
      if(running) return;
      running = true; distractions = 0; distractCountEl.textContent = 0;
      startBtn.style.display = 'none'; stopBtn.style.display = 'inline-block';
      const totalSeconds = plannedMin*60;
      let elapsed = 0;
      interval = setInterval(()=>{
        elapsed++; remaining = Math.max(0, totalSeconds - elapsed); render();
        if(remaining <= 0){
          clearInterval(interval); running = false;
          startBtn.style.display = 'inline-block'; stopBtn.style.display = 'none';
          finishSession(totalSeconds);
        }
      }, 1000);
    });
    stopBtn.addEventListener('click', ()=>{
      if(!running) return;
      clearInterval(interval); running = false;
      const totalSeconds = plannedMin*60;
      const actualSeconds = totalSeconds - remaining;
      startBtn.style.display = 'inline-block'; stopBtn.style.display = 'none';
      finishSession(actualSeconds);
      remaining = plannedMin*60; render();
    });
  })();

  // LOG EMOTIONAL MOMENT
  (function(){
    const triggerEl = document.getElementById('evTrigger');
    const gapGroup = document.getElementById('evGapOptions');
    const recGroup = document.getElementById('evRecOptions');
    const saveBtn = document.getElementById('evSave');
    const statusEl = document.getElementById('evStatus');
    const historyEl = document.getElementById('evHistory');
    let gapVal = null, recVal = null;

    gapGroup.querySelectorAll('.choice-btn').forEach(b=>{
      b.addEventListener('click', ()=>{ gapGroup.querySelectorAll('.choice-btn').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); gapVal = Number(b.getAttribute('data-val')); });
    });
    recGroup.querySelectorAll('.choice-btn').forEach(b=>{
      b.addEventListener('click', ()=>{ recGroup.querySelectorAll('.choice-btn').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); recVal = Number(b.getAttribute('data-val')); });
    });

    async function renderHistory(){
      const log = (await safeGet(`emorecords:emocional:${currentMonth}`)) || [];
      historyEl.innerHTML = '';
      const labels = ['Gap 0 (instant)','Gap 1 (seconds)','Gap 2 (minutes)','Gap 3 (5+ min)'];
      const recLabels = ['Recovery 0 (ruminated)','Recovery 1 (~2h)','Recovery 2 (~30min)','Recovery 3 (5min or less)'];
      log.slice(-5).reverse().forEach(e=>{
        const div = document.createElement('div');
        div.className = 'entry';
        div.innerHTML = `<span class="entry-date">${e.date}${e.trigger ? ' · ' + e.trigger : ''}</span>${labels[e.gap]} · ${recLabels[e.recovery]}`;
        historyEl.appendChild(div);
      });
    }
    renderHistory();

    saveBtn.addEventListener('click', async ()=>{
      if(gapVal === null || recVal === null) return;
      const key = `emorecords:emocional:${currentMonth}`;
      const log = (await safeGet(key)) || [];
      log.push({ date: now.toLocaleDateString('en-GB'), trigger: triggerEl.value.trim(), gap: gapVal, recovery: recVal });
      await safeSet(key, log);
      await addXP(5);
      triggerEl.value = '';
      gapGroup.querySelectorAll('.choice-btn').forEach(x=>x.classList.remove('selected'));
      recGroup.querySelectorAll('.choice-btn').forEach(x=>x.classList.remove('selected'));
      gapVal = null; recVal = null;
      statusEl.textContent = 'Saved.'; setTimeout(()=>{ statusEl.textContent=''; }, 2200);
      renderHistory();
    });
  })();

  renderNav();
  renderAll();
  renderXPBar();
})();
</script>
</body>
</html>
